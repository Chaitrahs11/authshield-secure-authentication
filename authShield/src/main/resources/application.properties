spring.application.name=authShield
spring.profiles.active=local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authShield_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

authshield.mailtrap.api-url=${MAILTRAP_API_URL:https://sandbox.api.mailtrap.io/api/send/5003440}
authshield.mailtrap.api-token=${MAILTRAP_API_TOKEN:}
authshield.mailtrap.sender-email=${MAILTRAP_SENDER_EMAIL:no-reply@authshield.local}
authshield.mailtrap.sender-name=${MAILTRAP_SENDER_NAME:AuthShield}

authshield.jwt.secret-base64=${JWT_SECRET_BASE64:bG9jYWwtZGV2LWtleS1wbGVhc2UtY2hhbmdlLW1lLTIwMjYtQXV0aFNoaWVsZA==}
authshield.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
authshield.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
authshield.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
authshield.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
authshield.otp.max-sends=${OTP_MAX_SENDS:3}
authshield.otp.send-window-minutes=${OTP_SEND_WINDOW_MINUTES:15}
authshield.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
