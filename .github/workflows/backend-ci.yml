
name: AuthShield Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'authShield/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'authShield/**'
      - '.github/workflows/**'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: authShield_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authShield_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/authShield_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Spring Boot application
        run: mvn clean package
        working-directory: authShield

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./authShield
          file: ./authShield/dockerfile
          push: true
          tags: chaitrahs2003/authshield-be:latest
