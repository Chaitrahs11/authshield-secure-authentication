
name: AuthShield Angular CI

on:
  push:
    branches:
      - main
    paths:
      - 'authshield-ui/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'authshield-ui/**'
      - '.github/workflows/**'

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: authshield-ui

      - name: Build Angular application
        run: npm run build
        working-directory: authshield-ui

      - name: Run tests
        run: npm test -- --watch=false
        working-directory: authshield-ui

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./authshield-ui
          file: ./authshield-ui/Dockerfile
          push: true
          tags: chaitrahs2003/authshield-fe:latest
